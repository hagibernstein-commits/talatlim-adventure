 pp.innerHTML=`<b>${nm(p)}</b> ${chip(SP[p.sp].t)}<span class="lv">רמה ${p.lv}</span><div class="bar"><div class="fill ${hpCls(p.hp/maxHp(p))}" style="width:${Math.max(0,p.hp/maxHp(p)*100)}%"></div></div><div style="font-size:12px;margin-top:2px">${Math.max(0,p.hp)}/${maxHp(p)}</div><div class="bar xpb"><div class="fill" style="width:${p.xp/need(p.lv)*100}%"></div></div>`}

function newB(e){const z=zoneAt(P.x,P.y);return{e,z,pi:S.party.findIndex(m=>m.hp>0),eo:{x:0,y:0},po:{x:0,y:0},es:1,ps:1,ea:1,pa:1,ball:null,proj:null,fx:[],flash:{e:0,p:0},t:0}}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(sp||60)*(.4+Math.random());B.fx.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-20,l:.5+Math.random()*.3,m:.8,c:col,r:2+Math.random()*3})}}
const EP=()=>({x:240,y:90}),PP=()=>({x:104,y:190});
async function projectile(fromP,mv){const a=fromP?PP():EP(),d=fromP?EP():PP(),col=TY[mv.t].c;
 if(mv.t==='norm'){B.proj=null;return}
 if(mv.t==='earth'){await anim(280,p=>{B.proj={k:'rock',x:d.x,y:d.y-120+120*p*p,col}});B.proj=null;return}
 if(mv.t==='spark'){await anim(260,p=>{B.proj={k:'bolt',x:d.x,y:d.y,p,col}});B.proj=null;return}
 await anim(320,p=>{B.proj={k:mv.t,x:a.x+(d.x-a.x)*p,y:a.y+(d.y-a.y)*p-Math.sin(p*3.14)*20,col,p}});B.proj=null}
async function lunge(isP){const o=isP?B.po:B.eo,dx=isP?30:-30,dy=isP?-18:14;await anim(130,p=>{o.x=dx*p;o.y=dy*p});await anim(130,p=>{o.x=dx*(1-p);o.y=dy*(1-p)})}
async function hitFx(isP){const o=isP?B.po:B.eo;const f=isP?'p':'e';const q=isP?PP():EP();burst(q.x,q.y,'#fff',10,90);await anim(380,p=>{o.x=Math.sin(p*40)*5*(1-p);B.flash[f]=Math.floor(p*8)%2?0:1});o.x=0;B.flash[f]=0}
async function faintAnim(isP){const o=isP?B.po:B.eo;sfx('faint');await anim(600,p=>{o.y=p*40;if(isP)B.pa=1-p;else B.ea=1-p})}
function calc(a,d,mv){const atk=stOf(a.sp,a.lv,1)*(1+.5*(a.bst||0)),def=stOf(d.sp,d.lv,2),stab=SP[a.sp].t===mv.t?1.25:1,eff=(EFF[mv.t]&&EFF[mv.t][SP[d.sp].t])||1,crit=Math.random()<1/12,rr=.85+Math.random()*.15;
 return{dmg:Math.max(1,Math.floor(((2*a.lv/5+2)*mv.p*atk/def/50+2)*stab*eff*(crit?1.5:1)*rr)),eff,crit}}
async function useMove(a,d,mvk,isP){const mv=MV[mvk];
 await say(`${nm(a)}${isP?'':' הפראי'} השתמש ב${mv.n}!`,900);
 if(mvk==='buff'){sfx('buff');a.bst=Math.min((a.bst||0)+1,3);const q=isP?PP():EP();burst(q.x,q.y,'#ffd23f',16,50);await sleep(400);await say(`ההתקפה של ${nm(a)} עלתה!`,900);return}
 await lunge(isP);sfx('atk');
 if(Math.random()*100>=mv.a){sfx('miss');await say('ההתקפה החטיאה!',800);return}
 await projectile(isP,mv);sfx('hit');const r=calc(a,d,mv);d.hp=Math.max(0,d.hp-r.dmg);panels();await hitFx(!isP);
 if(r.crit)await say('מכה קריטית!',700);
 if(r.eff>1)await say('זה סופר יעיל!',800);else if(r.eff<1)await say('זה לא ממש יעיל...',800)}
function aiMove(e,p){const mvs=movesFor(e.sp,e.lv);if(!e.bst&&mvs.includes('buff')&&Math.random()<.15)return'buff';
 const att=mvs.filter(m=>m!=='buff');if(Math.random()<.3)return pick(att);
 let best=att[0],bs=-1;att.forEach(m=>{const mv=MV[m],eff=(EFF[mv.t]&&EFF[mv.t][SP[p.sp].t])||1,s=mv.p*eff*mv.a/100*(SP[e.sp].t===mv.t?1.25:1);if(s>bs){bs=s;best=m}});return best}
const spd=m=>stOf(m.sp,m.lv,3);
async function giveXp(m,amt){await say(`${nm(m)} קיבל ${amt} נקודות ניסיון!`,900);m.xp+=amt;
 while(m.xp>=need(m.lv)&&m.lv<50){m.xp-=need(m.lv);const om=maxHp(m),old=movesFor(m.sp,m.lv);m.lv++;m.hp+=maxHp(m)-om;sfx('lvl');panels();await say(`${nm(m)} עלה לרמה ${m.lv}!`,1100);
  for(const x of movesFor(m.sp,m.lv).filter(x=>!old.includes(x)))await say(`${nm(m)} למד את ${MV[x].n}!`,1100)}
 panels()}
async function startWild(){
 mode='trans';sfx('enc');
 const z=zoneAt(P.x,P.y),zn=ZONES[z],sp=pick(zn.sp);let lv=rnd(zn.lv[0],zn.lv[1]);
 const e=mkMon(sp,lv);await transition(true);
 B=newB(e);S.seen[sp]=1;S.party.forEach(m=>m.bst=0);

async function transition(cover){await anim(cover?900:500,p=>{TR={cover,p}});TR=null}
let TR=null;
function drawTrans(c){if(!TR)return;const p=TR.p;c.setTransform(2,0,0,2,0,0);
 if(TR.cover){if(p<.4){c.fillStyle='rgba(255,255,255,'+(Math.floor(p*20)%2?.8:0)+')';c.fillRect(0,0,352,288)}else{const k=(p-.4)/.6;c.fillStyle='#000';const n=12,h=288/n;for(let i=0;i<n;i++){const w=352*Math.min(1,k*1.4-i*.02);if(i%2)c.fillRect(0,i*h,w,h+1);else c.fillRect(352-w,i*h,w,h+1)}}}
 else{c.fillStyle='#000';const n=12,h=288/n;const k=1-p;for(let i=0;i<n;i++){const w=352*k;if(i%2)c.fillRect(0,i*h,w,h+1);else c.fillRect(352-w,i*h,w,h+1)}}}
async function battleLoop(){
 while(B){const act=await getAction();const res=await runTurn(act);if(res==='end')break}
 await endBattle()}
async function getAction(){
 while(true){const p=cur();msgEl.textContent=`מה ${nm(p)} יעשה?`;
  const k=await choose([{k:'fight',h:'⚔️ תקיפה'},{k:'ball',h:`⚪ כדור לכידה<small>נשארו ${S.balls}</small>`},{k:'pot',h:`🧪 שיקוי<small>נשארו ${S.pots} · +35 חיים</small>`},{k:'swap',h:'🔁 החלפה'},{k:'run',h:'🏃 בריחה',span:1,cls:'sec'}]);
  if(k==='fight'){const mv=await choose(movesFor(p.sp,p.lv).map(m=>({k:m,h:`${MV[m].n}${chip(MV[m].t)}<small>${MV[m].p?'עוצמה '+MV[m].p:'מחזק התקפה'}</small>`})).concat([{k:'back',h:'↩ חזרה',cls:'sec',span:1}]));if(mv==='back')continue;return{k:'move',m:mv}}
  if(k==='ball'){if(S.balls<=0){await say('נגמרו הכדורים!',900);continue}return{k:'ball'}}
  if(k==='pot'){if(S.pots<=0){await say('נגמרו השיקויים!',900);continue}if(p.hp>=maxHp(p)){await say('החיים כבר מלאים!',900);continue}return{k:'pot'}}
  if(k==='swap'){const i=await partyMenu(false);if(i==='back')continue;return{k:'swap',i}}
  if(k==='run')return{k:'run'}}}
async function partyMenu(forced){msgEl.textContent='מי ייכנס לקרב?';
 const o=S.party.map((m,i)=>({k:i,h:`${nm(m)} ${chip(SP[m.sp].t)}<small>רמה ${m.lv} · ${m.hp}/${maxHp(m)}</small>`,dis:m.hp<=0||i===B.pi}));if(!forced)o.push({k:'back',h:'↩ חזרה',cls:'sec',span:1});return choose(o)}
async function doSwap(i){await say(`חזור, ${nm(cur())}!`,700);await anim(250,p=>{B.ps=1-p;B.pa=1-p});B.pi=i;panels();B.po={x:0,y:0};await anim(250,p=>{B.ps=p;B.pa=p});B.ps=1;B.pa=1;await say(`קדימה, ${nm(cur())}!`,800)}
async function runTurn(act){
 const A=cur(),Em=B.e,em=aiMove(Em,A);
 if(act.k!=='move'){
  if(act.k==='swap')await doSwap(act.i);
  else if(act.k==='pot'){S.pots--;hud();sfx('heal');A.hp=Math.min(maxHp(A),A.hp+35);panels();burst(PP().x,PP().y,'#7cff9a',16,50);await say(`${nm(A)} התרפא!`,900)}
  else if(act.k==='ball'){if(await throwBall())return'end'}
  else if(act.k==='run'){const ch=clamp(.5+(spd(A)-spd(Em))/80,.3,.95);if(Math.random()<ch){sfx('run');await say('ברחת בהצלחה!',900);B.fled=true;return'end'}await say('לא הצלחת לברוח!',900)}
  await useMove(Em,cur(),em,false);if(cur().hp<=0)return await playerDown();return'cont'}
 const pFirst=spd(A)>spd(Em)||(spd(A)===spd(Em)&&Math.random()<.5);
 const seq=pFirst?[[A,Em,act.m,true],[Em,A,em,false]]:[[Em,A,em,false],[A,Em,act.m,true]];
 for(const [a,d,m,isP] of seq){if(a.hp<=0)break;await useMove(a,d,m,isP);if(d.hp<=0){return isP?await enemyDown():await playerDown()}}
 return'cont'}
async function enemyDown(){const e=B.e;await faintAnim(false);await say(`${nm(e)} הפראי הובס!`,1000);
 const coins=e.lv*2+rnd(0,4);S.coins+=coins;hud();
 const xp=Math.floor(SP[e.sp].xp*e.lv/5);const p=cur();if(p.hp>0)await giveXp(p,xp);
 if(Math.random()<.35){S.balls++;hud();await say('מצאת כדור לכידה!',900)}
 await say(`קיבלת ${coins} מטבעות 🪙`,800);return'end'}
async function playerDown(){await faintAnim(true);await say(`${nm(cur())} התעלף...`,1000);
 if(alive()===0){await say('כל הטלטלים שלך התעייפו...',1200);B.lost=true;return'end'}
 const i=await partyMenu(true);B.pi=i;panels();B.po={x:0,y:0};B.pa=1;B.ps=1;await say(`קדימה, ${nm(cur())}!`,800);return'cont'}
async function throwBall(){S.balls--;hud();const e=B.e;await say('זורק כדור לכידה!',700);sfx('throw');
 const a=PP(),d=EP();await anim(600,p=>{B.ball={x:a.x+(d.x-a.x)*p,y:a.y+(d.y-a.y)*p-Math.sin(p*3.14)*60,r:p*12.5,s:1}});
 await anim(300,p=>{B.es=1-p;B.ea=1-p*.6;B.ball={x:d.x,y:d.y,r:12.5,s:1}});B.ea=0;
 await anim(350,p=>{B.ball={x:d.x,y:d.y+22*p*p+Math.sin(p*3.14)*-8,r:12.5,s:1}});
 const pc=clamp((3*maxHp(e)-2*e.hp)/(3*maxHp(e))*SP[e.sp].cr,.03,.95),sh=Math.pow(pc,1/3);let k=0;
 for(let i=0;i<3;i++){await sleep(350);sfx('tick');await anim(420,p=>{B.ball={x:d.x,y:d.y+22,r:12.5,s:1,rot:Math.sin(p*6.283)*.5*(1-p*.4)}});if(Math.random()<sh)k++;else break}
 if(k===3){sfx('ok');burst(d.x,d.y+10,'#ffd23f',24,70);await say(`${nm(e)} נתפס! 🎉`,1300);
  S.caught[e.sp]=1;e.hp=Math.max(1,e.hp);e.bst=0;let where;if(S.party.length<6){S.party.push(e);where='הצטרף לצוות שלך'}else{S.box.push(e);where='נשלח לקופסה'}
  save();await say(`${nm(e)} ${where}!`,1100);B.caught=true;B.ball=null;return true}
 B.ball=null;B.ea=1;await anim(300,p=>{B.es=p});B.es=1;
 await say(['הוא יצא מיד מהכדור!','כמעט! הוא יצא מהכדור!','איזה קרוב! אבל הוא יצא!'][k],1200);return false}
async function endBattle(){
 const lost=B&&B.lost;mode='trans';await transition(true);
 S.party.forEach(m=>{m.bst=0});
 if(lost){S.coins=Math.floor(S.coins/2);S.party.forEach(m=>m.hp=maxHp(m));P.x=23;P.y=20;P.px=23;P.py=20;P.dir='up';S.x=23;S.y=20}
 B=null;bui.style.display='none';menuEl.style.display='none';mapctrl.style.display='block';$('#hud').style.display='flex';pe.style.display='none';pp.style.display='none';hud();save();
 mode='map';await transition(false);
 if(lost)toast('התעוררת בבקתת הריפוי. איבדת חצי מהמטבעות.',3500)}

function drawBattle(ts){const c=cx;c.setTransform(2,0,0,2,0,0);const t=ts/1000,z=ZONES[B.z].bg;
 let g=c.createLinearGradient(0,0,0,288);g.addColorStop(0,z[0]);g.addColorStop(.5,z[1]);g.addColorStop(.5,z[2]);g.addColorStop(1,shade(z[2]));c.fillStyle=g;c.fillRect(0,0,352,288);
 for(let i=0;i<4;i++)E(c,40+i*100,120,60,18,'rgba(0,0,0,.06)');
 E(c,240,118,70,15,'rgba(0,0,0,.18)');E(c,240,116,60,12,'rgba(255,255,255,.15)');E(c,104,228,86,19,'rgba(0,0,0,.2)');E(c,104,226,74,15,'rgba(255,255,255,.15)');
 const eb=Math.sin(t*2.5)*2,pb=Math.sin(t*2.2+1)*2;
 if(B.ea>0&&!(B.flash.e)){drawMon(c,B.e.sp,240+B.eo.x,88+B.eo.y+eb,80*B.es,t,B.ea)}
 const p=cur();if(p&&B.pa>0&&!(B.flash.p)){drawMon(c,p.sp,104+B.po.x,184+B.po.y+pb,104*B.ps,t,B.pa)}
 if(B.ball)drawBall(c,B.ball);
 const pr=B.proj;if(pr){c.save();if(pr.k==='rock'){E(c,pr.x,pr.y,10,9,pr.col);E(c,pr.x-3,pr.y-3,4,3,'#d8b888')}
  else if(pr.k==='bolt'){c.strokeStyle=pr.col;c.lineWidth=5;c.lineJoin='round';c.beginPath();let x=pr.x,y=pr.y-140;c.moveTo(x,y);for(let i=1;i<=6;i++){x=pr.x+(i%2?10:-10)*(1-pr.p*.5);y=pr.y-140+i*(140/6)*Math.min(1,pr.p*2.2);c.lineTo(x,y)}c.stroke();c.strokeStyle='#fff';c.lineWidth=2;c.stroke()}
  else if(pr.k==='plant'){E(c,pr.x,pr.y,9,4,pr.col,pr.p*12);E(c,pr.x-14,pr.y+2,7,3,pr.col,pr.p*9)}
  else if(pr.k==='water'){E(c,pr.x,pr.y,8,10,pr.col);E(c,pr.x-12,pr.y+3,5,6,pr.col)}
  else{E(c,pr.x,pr.y,11,11,pr.col);E(c,pr.x,pr.y,6,6,'#ffe9a0');E(c,pr.x-14,pr.y+3,6,6,pr.col)}c.restore()}
 const dt=1/60;B.fx=B.fx.filter(f=>{f.l-=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=140*dt;return f.l>0});B.fx.forEach(f=>{c.globalAlpha=Math.max(0,f.l/f.m);E(c,f.x,f.y,f.r,f.r,f.c)});c.globalAlpha=1}
function shade(h){const n=parseInt(h.slice(1),16);const r=(n>>16)*.8|0,g=(n>>8&255)*.8|0,b=(n&255)*.8|0;return'rgb('+r+','+g+','+b+')'}
function drawBall(c,b){c.save();c.translate(b.x,b.y);if(b.rot)c.rotate(b.rot);const r=Math.max(2,b.r||12);E(c,0,0,r,r,'#4a3ad0');E(c,-r*.3,-r*.35,r*.35,r*.25,'rgba(255,255,255,.5)');c.strokeStyle='#ffd23f';c.lineWidth=2;c.beginPath();c.arc(0,0,r,0,7);c.stroke();
 poly(c,[0,-r*.5,r*.15,-r*.12,r*.5,-r*.1,r*.2,r*.12,r*.3,r*.5,0,r*.28,-r*.3,r*.5,-r*.2,r*.12,-r*.5,-r*.1,-r*.15,-r*.12],'#ffd23f');c.restore()}

 <button class="btn" id="d2" ${(!inP&&S.party.length>=6)||(inP&&S.party.length<=1)?'disabled':''}>${inP?'📦 העבר לקופסה':'👥 העבר לצוות'}</button><button class="btn sec" id="d3">סגור</button></div>`,b=>{
  b.querySelector('#mc').appendChild(monCanvas(m.sp,70));
  b.querySelector('#d1').onclick=()=>{let from=S.party.indexOf(m);if(from<0){if(S.party.length>=6)return;S.box.splice(S.box.indexOf(m),1);S.party.unshift(m)}else{S.party.splice(from,1);S.party.unshift(m)}save();closeModal();collTab(cT)};
  b.querySelector('#d2').onclick=()=>{if(inP){S.party.splice(S.party.indexOf(m),1);S.box.push(m)}else{S.box.splice(S.box.indexOf(m),1);S.party.push(m)}save();closeModal();collTab(cT)};
  b.querySelector('#d3').onclick=closeModal})}
function spDetail(i){const sp=SP[i],c=S.caught[i];modal(`<div id="mc"></div><h2 style="margin:6px 0">${sp.n} ${chip(sp.t)}</h2>
 ${statRow('חיים',sp.b[0],90)}${statRow('התקפה',sp.b[1],90)}${statRow('הגנה',sp.b[2],90)}${statRow('מהירות',sp.b[3],90)}
 <div class="flav">${sp.f}</div><div class="flav">📍 נמצא ב: ${sp.h.split(', ').map(z=>ZONES[z].n).join(', ')}</div><button class="btn sec" id="d3" style="width:100%">סגור</button>`,b=>{b.querySelector('#mc').appendChild(monCanvas(i,70));b.querySelector('#d3').onclick=closeModal})}
let cT=0;
function openColl(){mode='menu';hideScr('mnu');showScr('coll');collTab(0)}
function collTab(t){cT=t;const el=$('#coll');el.scrollTop=0;const n=Object.keys(S.caught).length;
 el.innerHTML=`<div class="top"><h2>האוסף שלי · ${n}/${SP.length}</h2><button class="x" id="cx">✕</button></div>
 <div class="tabs"><button class="btn ${t==0?'cur':'sec'}" data-t="0">הטלטלים שלי</button><button class="btn ${t==1?'cur':'sec'}" data-t="1">אנציקלופדיה</button><button class="btn ${t==2?'cur':'sec'}" data-t="2">טבלת סוגים</button></div><div id="cb"></div>`;
 el.querySelector('#cx').onclick=()=>{hideScr('coll');mode='map'};
 el.querySelectorAll('.tabs .btn').forEach(b=>b.onclick=()=>collTab(+b.dataset.t));
 const cb=el.querySelector('#cb');
 if(t===0){cb.insertAdjacentHTML('beforeend','<h3 style="margin:6px 0">הצוות (עד 6)</h3>');let g=document.createElement('div');g.className='grid';S.party.forEach((m,i)=>g.appendChild(monCard(m,i,()=>monDetail(m))));cb.appendChild(g);
  cb.insertAdjacentHTML('beforeend',`<h3 style="margin:12px 0 6px">הקופסה (${S.box.length})</h3>`);g=document.createElement('div');g.className='grid';S.box.forEach(m=>g.appendChild(monCard(m,-1,()=>monDetail(m))));cb.appendChild(g);if(!S.box.length)cb.insertAdjacentHTML('beforeend','<div class="flav">הקופסה ריקה. טלטלים נוספים שתתפוס יגיעו לכאן כשהצוות מלא.</div>')}
 if(t===1){const g=document.createElement('div');g.className='grid';SP.forEach((sp,i)=>{const d=document.createElement('div');d.className='card';const c=S.caught[i],s=S.seen[i]||c;
  d.appendChild(monCanvas(i,36,!s));d.insertAdjacentHTML('beforeend',`<div><b>${s?sp.n:'???'}</b></div><div style="font-size:12px">${c?'✅ נתפס':s?'👁 נראה':'לא ידוע'}</div>`);if(s)d.onclick=()=>spDetail(i);g.appendChild(d)});cb.appendChild(g)}
 if(t===2){const ts=['fire','water','plant','spark','earth'];cb.innerHTML=ts.map(a=>{const st=ts.filter(d=>(EFF[a][d]||1)>1),wk=ts.filter(d=>(EFF[a][d]||1)<1);return`<div class="card" style="margin:6px 0;text-align:right;font-size:15px">${chip(a)}<div style="margin:6px 0">💪 חזק נגד: ${st.map(chip).join(' ')||'—'}</div><div>🛡 חלש נגד: ${wk.map(chip).join(' ')||'—'}</div></div>`}).join('')+'<div class="flav">טלטל מאותו סוג של המכה מקבל בונוס. התחזקות מעלה את ההתקפה למשך הקרב.</div>'}}
function openMenu(){if(mode!=='map')return;mode='menu';const el=$('#mnu');el.innerHTML=`<div class="top"><h2>תפריט</h2><button class="x" id="mx">✕</button></div>
 <div style="display:grid;gap:10px;margin-top:10px"><button class="btn grn" id="m1">📖 האוסף והטלטלים שלי</button><button class="btn" id="m2">🔊 סאונד: ${S.snd?'פועל':'מושתק'}</button><button class="btn sec" id="m3">🎒 ⚪ ${S.balls} · 🧪 ${S.pots} · 🪙 ${S.coins}</button><button class="btn red" id="m4">🗑 התחלה מחדש</button><button class="btn sec" id="m5" style="min-height:40px">גרסה ${VER}</button></div>`;showScr('mnu');
 el.querySelector('#mx').onclick=()=>{hideScr('mnu');mode='map'};el.querySelector('#m1').onclick=openColl;
 el.querySelector('#m2').onclick=()=>{toggleMute();openMenuRefresh()};
 let sure=false;el.querySelector('#m4').onclick=e=>{if(!sure){sure=true;e.target.textContent='בטוח? כל ההתקדמות תימחק. לחץ שוב';return}localStorage.removeItem(KEY);location.reload()}}
function openMenuRefresh(){hideScr('mnu');mode='map';openMenu()}
function toggleMute(){S.snd=!S.snd;$('#bmute').textContent=S.snd?'🔊':'🔇';save();if(S.snd)sfx('pick')}
/* ---------- כותרת ובחירת מתחיל ---------- */
function showTitle(){mode='title';const el=$('#title');el.style.display='block';
 el.innerHTML=`<h1>הרפתקת הטלטלים</h1><p>תפסו, אמנו וגלו את כל הטלטלים!</p><div id="tmons"></div>
 ${S.started?'<button class="btn grn" id="t1">▶ המשך משחק</button><button class="btn sec" id="t2">משחק חדש</button>':'<button class="btn grn" id="t1">▶ התחל הרפתקה</button>'}`;
 const tm=el.querySelector('#tmons');[0,2,4,6,7,8].forEach(i=>tm.appendChild(monCanvas(i,39)));
 el.querySelector('#t1').onclick=()=>{ac();sfx('pick');if(S.started){el.style.display='none';startMap()}else starterPick()};
 const t2=el.querySelector('#t2');if(t2){let sure=false;t2.onclick=()=>{if(!sure){sure=true;t2.textContent='בטוח? ההתקדמות תימחק. לחץ שוב';return}S=newState();save();starterPick()}}}
function starterPick(){const el=$('#title');el.innerHTML=`<h2 style="margin-top:2vh">בחרו את הטלטל הראשון שלכם!</h2><div class="pick" id="pk"></div>`;const pk=el.querySelector('#pk');
 STARTERS.forEach(i=>{const sp=SP[i],d=document.createElement('div');d.className='card';d.appendChild(monCanvas(i,42));d.insertAdjacentHTML('beforeend',`<div><b style="font-size:19px">${sp.n}</b> ${chip(sp.t)}<div class="flav" style="margin:4px 0 0">${sp.f}</div></div>`);
  d.onclick=()=>{sfx('ok');const m=mkMon(i,5);S.party=[m];S.box=[];S.caught[i]=1;S.seen[i]=1;S.started=true;S.x=23;S.y=21;S.dir='up';P.x=P.px=23;P.y=P.py=21;P.dir='up';save();el.style.display='none';startMap(true)};pk.appendChild(d)})}
function startMap(first){mode='map';region='';hud();$('#bmute').textContent=S.snd?'🔊':'🔇';if(first)toast('ברוך הבא! התקרב לשלט שליד הדרך 🪧',4000);else toast('📍 '+ZONES[zoneAt(P.x,P.y)].n)}
/* ---------- קלט ---------- */
const dp=$('#dpad');let dpId=null;
function dpadOff(){held=null;dpId=null;dp.querySelectorAll('i').forEach(i=>i.classList.remove('on'))}
function dpUpdate(e){const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);let d=null;if(Math.hypot(dx,dy)>r.width*.1){d=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}held=d;dp.querySelectorAll('i').forEach(i=>i.classList.toggle('on',i.classList.contains({up:'u',down:'d',left:'l',right:'r'}[d]||'-')))}
dp.addEventListener('pointerdown',e=>{ac();dpId=e.pointerId;try{dp.setPointerCapture(e.pointerId)}catch(_){}dpUpdate(e);e.preventDefault()});
dp.addEventListener('pointermove',e=>{if(e.pointerId===dpId)dpUpdate(e)});
['pointerup','pointercancel','lostpointercapture'].forEach(n=>dp.addEventListener(n,e=>{if(e.pointerId===dpId)dpadOff()}));
$('#abtn').addEventListener('pointerdown',e=>{ac();tapA=true;e.preventDefault()});
$('#bmenu').onclick=()=>{ac();openMenu()};$('#bmute').onclick=()=>{ac();toggleMute()};
const KD={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',s:'down',a:'left',d:'right'};
addEventListener('keydown',e=>{const d=KD[e.key];if(d){held=d;e.preventDefault()}else if(e.key==='Enter'||e.key===' '||e.key==='z'){tapA=true;e.preventDefault()}else if(e.key==='Escape'||e.key==='m')openMenu()});
addEventListener('keyup',e=>{if(KD[e.key]&&held===KD[e.key])held=null});
document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});
addEventListener('contextmenu',e=>e.preventDefault());
/* ---------- לולאה ראשית ---------- */
let last=performance.now();
function frame(ts){const dt=Math.min(.05,(ts-last)/1000);last=ts;
 try{updateMap(dt);if(B&&(mode==='battle'||mode==='trans'))drawBattle(ts);else if(mode!=='title')drawMap(ts);else{cx.setTransform(1,0,0,1,0,0);cx.fillStyle='#0e1a12';cx.fillRect(0,0,704,576)}
 if(mode==='trans'||TR)drawTrans(cx)}catch(err){console.error(err)}
 requestAnimationFrame(frame)}
window.__g={get S(){return S},get B(){return B},P,startWild,openColl,hutMenu,openMenu,get mode(){return mode},M,say,SP};
hud();showTitle();
const qs=location.hash;
if(qs.includes('dbg')){S=newState();const m=mkMon(0,6);S.party=[m,mkMon(2,5)];S.started=true;S.caught[0]=1;S.caught[2]=1;S.seen[0]=1;S.seen[2]=1;$('#title').style.display='none';startMap();
 if(qs.includes('battle')){P.x=P.px=5;P.y=P.py=5;setTimeout(startWild,100)}if(qs.includes('coll'))setTimeout(openColl,100)}
requestAnimationFrame(frame);
})();
