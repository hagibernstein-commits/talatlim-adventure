<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none}
html,body{margin:0;height:100%;background:#0e1a12;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden;touch-action:none;overscroll-behavior:none}
#app{position:relative;height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:linear-gradient(#1c3a2a,#0e1a12)}
#stage{position:relative;flex:none;width:min(100%,calc(54vh*11/9));width:min(100%,calc(54dvh*11/9));aspect-ratio:11/9;margin:0 auto;background:#000;overflow:hidden}
#cv{width:100%;height:100%;display:block}
#hud{position:absolute;top:6px;left:6px;right:6px;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
#hud .stat{background:rgba(10,20,14,.7);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:700;direction:rtl}
#hud .bt{pointer-events:auto;width:40px;height:40px;border-radius:50%;border:2px solid #fff6;background:rgba(10,20,14,.75);color:#fff;font-size:18px;margin-inline-start:6px;display:flex;align-items:center;justify-content:center;padding:0}
#bottom{position:relative;flex:1;min-height:0}
#mapctrl{position:absolute;inset:0;direction:ltr;--b:min(21vw,13vh,86px)}
#dpad{position:absolute;left:3%;top:50%;transform:translateY(-50%);width:calc(var(--b)*3);height:calc(var(--b)*3);touch-action:none;border-radius:50%;background:radial-gradient(circle,#ffffff14,#ffffff06 70%);}
#dpad i{position:absolute;width:var(--b);height:var(--b);display:flex;align-items:center;justify-content:center;font-style:normal;font-size:calc(var(--b)*.42);color:#fff;background:#ffffff22;border-radius:16px;border:2px solid #ffffff30;pointer-events:none}
#dpad i.on{background:#ffd23f;color:#3a2200}
#dpad .u{left:var(--b);top:0}#dpad .d{left:var(--b);top:calc(var(--b)*2)}#dpad .l{left:0;top:var(--b)}#dpad .r{left:calc(var(--b)*2);top:var(--b)}
#abtn{position:absolute;right:6%;top:50%;transform:translateY(-50%);width:calc(var(--b)*1.5);height:calc(var(--b)*1.5);border-radius:50%;border:4px solid #fff8;background:radial-gradient(circle at 35% 30%,#ffb066,#ff6a1f);color:#fff;font:800 calc(var(--b)*.3)/1 system-ui,Arial;box-shadow:0 5px 0 #a8420e;touch-action:none}
#abtn:active{transform:translateY(-47%);box-shadow:0 2px 0 #a8420e}
#bui{position:absolute;inset:0;display:none;flex-direction:column;padding:8px;gap:8px}
#msg{flex:none;min-height:64px;background:#fffbe8;color:#222;border:3px solid #6a4a1f;border-radius:12px;padding:10px 12px;font-size:18px;font-weight:700;line-height:1.35;display:flex;align-items:center}
#menu{display:none;grid-template-columns:1fr 1fr;gap:8px;overflow:auto;touch-action:pan-y}
.btn{background:linear-gradient(#ffe29a,#ffb347);color:#3a2200;border:0;border-radius:12px;font:700 17px/1.2 system-ui,Arial;padding:10px 8px;min-height:54px;box-shadow:0 3px 0 #b36b00;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #b36b00}
.btn:disabled{opacity:.4}
.btn.sec{background:linear-gradient(#d7e0ea,#aab8c8);box-shadow:0 3px 0 #6d7d90;color:#1c2733}
.btn.red{background:linear-gradient(#ff9a8a,#ee5a45);box-shadow:0 3px 0 #9c2a1c;color:#fff}
.btn.grn{background:linear-gradient(#9fe88a,#4cc24a);box-shadow:0 3px 0 #2a7a2a;color:#0d2a0d}
.btn small{font-size:12px;font-weight:600;opacity:.85}
.chip{display:inline-block;border-radius:10px;padding:1px 8px;font-size:12px;font-weight:800;color:#1b1b1b}
.pn{position:absolute;background:rgba(14,24,18,.88);border:2px solid #ffffff44;border-radius:12px;padding:5px 9px;font-size:13px;width:47%;z-index:4;display:none}
.pn b{font-size:14px}.pn .lv{float:left;opacity:.9}
.bar{height:9px;background:#2a3a30;border-radius:6px;margin-top:4px;overflow:hidden}
.fill{height:100%;width:100%;background:#4cc24a;transition:width .6s ease,background .3s}
.fill.m{background:#ffc83a}.fill.l{background:#ee4a3a}
.xpb{height:5px}.xpb .fill{background:#4aa3ff;transition:width .5s}
#pe{top:8%;left:4%}#pp{bottom:6%;right:4%}
#toast{position:absolute;top:14%;left:50%;transform:translateX(-50%);background:rgba(10,20,14,.85);border:2px solid #ffd23f;border-radius:14px;padding:8px 16px;font-size:16px;font-weight:800;z-index:9;display:none;max-width:90%;text-align:center}
.scr{position:absolute;inset:0;z-index:20;background:linear-gradient(#1c3a2a,#0e1a12);overflow-y:auto;padding:12px;display:none;touch-action:pan-y}
.scr h2{margin:4px 0 10px;font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center}
.x{width:42px;height:42px;border-radius:50%;border:2px solid #fff5;background:#0006;color:#fff;font-size:20px;padding:0}
.tabs{display:flex;gap:6px;margin:8px 0}
.tabs .btn{flex:1;min-height:42px;font-size:14px;padding:6px 4px}
.tabs .btn.cur{background:linear-gradient(#9fe88a,#4cc24a);box-shadow:0 3px 0 #2a7a2a}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#ffffff14;border:2px solid #ffffff30;border-radius:14px;padding:8px 4px;text-align:center;font-size:13px;position:relative}
.card canvas{width:72px;height:72px}
.card .bar{margin:4px 8px 0}
.badge{position:absolute;top:4px;right:6px;background:#ffd23f;color:#3a2200;border-radius:10px;font-size:11px;font-weight:800;padding:0 6px}
.modal{position:absolute;inset:0;z-index:50;background:#000a;display:none;align-items:center;justify-content:center;padding:14px;touch-action:pan-y}
.mbox{background:linear-gradient(#27493a,#162a20);border:3px solid #ffffff44;border-radius:18px;padding:14px;width:100%;max-height:100%;overflow-y:auto;text-align:center}
.mbox .row{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:14px;text-align:right}
.mbox .row span.l{width:62px}
.mbox .row .bar{flex:1;margin:0}
.mbox .row span.v{width:30px;text-align:left}
.mv{display:flex;justify-content:space-between;align-items:center;background:#ffffff14;border-radius:10px;padding:6px 10px;margin:4px 0;font-size:14px}
.flav{font-size:14px;opacity:.9;margin:8px 0;line-height:1.4}
#title{background:radial-gradient(circle at 50% 30%,#3d7a52,#0e1a12 75%);text-align:center;z-index:40;display:none;padding-top:5vh}
#title h1{font-size:34px;margin:6px 0;text-shadow:0 3px 0 #0008;color:#ffe08a}
#title p{opacity:.9;margin:4px 0 14px}
#tmons{display:flex;justify-content:center;gap:2px;margin:6px 0 14px;flex-wrap:wrap}
#tmons canvas{width:78px;height:78px}
#title .btn{margin:8px auto;width:80%;font-size:20px}
.pick{display:flex;flex-direction:column;gap:10px}
.pick .card{display:flex;align-items:center;gap:10px;text-align:right;padding:8px 12px;font-size:15px}
.pick .card canvas{width:84px;height:84px;flex:none}

#app.walk #stage{width:100%;height:100dvh;aspect-ratio:auto;max-height:100dvh}
#app.walk #bottom{flex:0}
#stage #mapctrl{z-index:6;pointer-events:none}
#stage #mapctrl>*{pointer-events:auto}
#dpad{left:18px;top:auto;bottom:18px;transform:none;width:116px;height:116px;border:2px solid #ffffff70;background:radial-gradient(circle,#ffffff30,#13291dcc);box-shadow:0 4px 15px #0005}
#dpad i{left:32px;top:32px;width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#eaf4d0,#8ac878);border:2px solid #fff9;box-shadow:0 3px 6px #0005;will-change:transform}
#abtn{right:20px;top:auto;bottom:40px;transform:none;width:64px;height:64px;border-width:2px;font-size:15px;box-shadow:0 3px 0 #a8420e}
#abtn:active{transform:translateY(2px)}
#stickhint{position:absolute;bottom:3px;left:22px;font-size:11px;opacity:.75;pointer-events:none!important}
#arrows{position:absolute;left:14px;bottom:16px;width:170px;height:170px;display:none}
#arrows button{position:absolute;width:56px;height:56px;font-size:24px;line-height:1;color:#fff;background:#ffffff33;border:2px solid #ffffff80;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 3px 8px #0006}
#arrows button.on{background:#ffd23f;color:#3a2200}
#arrows .au{left:57px;top:0}#arrows .ad{left:57px;top:114px}#arrows .al{left:0;top:57px}#arrows .ar{left:114px;top:57px}
@media(max-height:600px){#arrows{transform:scale(.82);transform-origin:bottom left;left:10px;bottom:8px}}
input.nick{width:100%;padding:12px;border:2px solid #a8dca1;border-radius:10px;font:18px system-ui;background:#f7ffef;color:#183220;user-select:text;touch-action:auto}
@media(max-height:600px){#app.walk #stage{width:100%}#dpad{width:96px;height:96px;left:12px;bottom:10px}#dpad i{left:22px;top:22px}#abtn{bottom:25px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tin{from{opacity:0;transform:translateX(-50%) translateY(-8px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(10px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes glow{0%,100%{text-shadow:0 3px 0 #0008,0 0 14px #ffd23f66}50%{text-shadow:0 3px 0 #0008,0 0 28px #ffd23faa}}
#toast{animation:tin .25s ease-out}
#tmons canvas{animation:bob 2.6s ease-in-out infinite}
#tmons canvas:nth-child(2n){animation-delay:.45s}
#tmons canvas:nth-child(3n){animation-delay:.9s}
#title h1{animation:glow 3s ease-in-out infinite}
#title{background:radial-gradient(circle at 50% 30%,#4a9468,#0e1a12 75%)}
.mbox{animation:pop .18s ease-out}
.pn{animation:pop .2s ease-out;box-shadow:0 4px 14px #0006}
.btn{transition:filter .15s}
.btn:not(:disabled):hover{filter:brightness(1.07)}
.card{transition:transform .12s}
.card:active{transform:scale(.97)}
#msg{box-shadow:0 3px 10px #0004}
@media(prefers-reduced-motion:reduce){#tmons canvas,#title h1,#toast,.mbox,.pn{animation:none}}
</style>
</head>

</div>

function tryMove(d){if(P.moving||mode!=='map')return;P.dir=d;const v=DIRS[d],nx=P.x+v[0],ny=P.y+v[1];if(solidAt(nx,ny)){if(!P.bump||performance.now()-P.bump>400){P.bump=performance.now();sfx('bump')}return}

function updateMap(dt){
 if(mode!=='map')return;const prior=isNight();S.clock=(S.clock||0)+dt;const cyc=spotCyc();if(S.lastCyc==null)S.lastCyc=cyc;else if(S.lastCyc!==cyc){S.lastCyc=cyc;toast('✦ נקודות הניצוץ התמלאו שוב במפה!',3500)}if(prior!==isNight()){toast(isNight()?'🌙 הלילה הגיע! טלטלי הלילה התעוררו':'☀️ בוקר טוב! טלטלי היום חזרו',4000)}hud();
 if(P.moving){P.mt+=dt/(STEP/(.55+.45*analogPower));const k=Math.min(P.mt,1);P.px=P.from.x+(P.to.x-P.from.x)*k;P.py=P.from.y+(P.to.y-P.from.y)*k;

}

function wildLevelRange(z,party=S.party){
 const zn=ZONES[z],levels=party.map(m=>m.lv).filter(l=>Number.isFinite(l)&&l>=1);
 if(!levels.length)return zn.lv.slice();
 const average=levels.reduce((a,b)=>a+b,0)/levels.length;
 const strength=Math.round((average+Math.max(...levels))/2);
 const margin={A:1,B:1,E:2,C:2,D:3,F:3,G:3,H:2,I:4}[z]||1;
 const high=Math.min(zn.lv[1],strength+margin);
 const low=Math.max(1,Math.min(zn.lv[0],high-2));
 return[low,high];
}

function lostFound(){mode='menu';S.story.lostFound=1;save();sfx('ok');modal(`<h2> מצאתם את פטרוש!</h2><div id="lfb" style="display:flex;justify-content:center"></div><p>הוא הסתתר בעשב ורועד קצת, אבל הוא שמח לראות אתכם. הוא ילווה אתכם בחזרה לדני!</p><button class="btn grn" id="lfo" style="width:100%">בחזרה לדני!</button>`,b=>{b.querySelector('#lfb').appendChild(monCanvas(5,70));b.querySelector('#lfo').onclick=()=>{closeModal();mode='map';toast('פטרוש הולך אחריכם! חזרו לדני שליד הבקתה',4000)}})}
function letterDeliver(){mode='menu';modal(`<h2> המכתב הגיע!</h2><p>שלג חוקר המערות קורא את המכתב ומחייך: ״סוף סוף חדשות מנרקיס! תודה שהגעת עד לכאן. בחרו מתנה:״</p><div style="display:grid;gap:8px"><button class="btn grn" id="ld1">⚪ 20 כדורי לכידה</button><button class="btn grn" id="ld2"> קמיע הטיפות<small>מחזק מכות מים של טלטל שמחזיק אותו ב־20%</small></button></div>`,b=>{
 const fin=()=>{S.story.letter=2;S.quests.letterq=2;save();hud();sfx('ok');closeModal();mode='map';toast(' המשימה הושלמה! שלג מודה לכם',3500)};
 b.querySelector('#ld1').onclick=()=>{S.balls+=20;fin()};b.querySelector('#ld2').onclick=()=>{S.items=S.items||{};S.items.charm_water=(S.items.charm_water||0)+1;fin()}})}
function storyMenu(q){mode='menu';const phase=S.quests[q.id]||0;const back=`<button class="btn sec" id="sqc" style="width:100%;margin-top:10px">חזרה למפה</button>`;
 const wire=b=>{b.querySelector('#sqc').onclick=()=>{closeModal();mode='map'}};
 if(q.id==='lostq'){
  if(phase===2){modal(`<h2>דני ופטרוש האבוד</h2><p>דני ופטרוש משחקים יחד שוב. תודה על העזרה!</p>`+back,wire);return}
  if(phase===1){
   if((S.story||{}).lostFound===1){modal(`<h2>דני ופטרוש האבוד</h2><p>״מצאתם אותו! תודה רבה!״ דני מחבק את פטרוש. ״בחרו מתנה:״</p><div style="display:grid;gap:8px"><button class="btn grn" id="lq1">🪙 150 מטבעות ו־8 כדורי לכידה</button><button class="btn grn" id="lq2"> פרי מרפא ו־ קמיע העלים<small>פריטים לטלטלים שלכם</small></button></div>`,b=>{
    const fin=()=>{S.story.lostFound=2;S.quests.lostq=2;save();hud();sfx('ok');closeModal();mode='map';toast(' פטרוש חזר הביתה! המשימה הושלמה',3500)};
    b.querySelector('#lq1').onclick=()=>{S.coins+=150;S.balls+=8;fin()};
    b.querySelector('#lq2').onclick=()=>{S.items=S.items||{};S.items.berry=(S.items.berry||0)+1;S.items.charm_plant=(S.items.charm_plant||0)+1;fin()}});return}
   modal(`<h2>דני ופטרוש האבוד</h2><p>״הוא אוהב להתחבא בעשב הגבוה באחו הפרחים, מערבה מכאן. חפשו סימן !״</p>`+back,wire);return}
  modal(`<h2>דני ופטרוש האבוד</h2><p>דני מחכה ליד הבקתה: ״הפטרוש שלי ברח! הוא פחדן ואוהב עשב גבוה. תעזרו לי למצוא אותו?״</p><button class="btn grn" id="sqa" style="width:100%">נעזור לך!</button>`+back,b=>{wire(b);b.querySelector('#sqa').onclick=()=>{S.quests.lostq=1;save();sfx('ok');closeModal();mode='map';toast(' חפשו את פטרוש בעשב הגבוה של אחו הפרחים!',4000)}});return}
 if(q.id==='riddleq'){
  if(phase===2){modal(`<h2>סבתא חכמה</h2><p>״ניחשתם נכון! בואו לבקר שוב, תמיד יש לי חידות.״</p>`+back,wire);return}
  if(phase===1){modal(`<h2> החידה של סבתא</h2><p>״אני מופיע אחרי הגשם ושומר על היער, והכובע שלי נוצץ בחושך. מי אני?״</p><div style="display:grid;gap:8px"><button class="btn" id="r1">ברקי</button><button class="btn" id="r2">פטרוש</button><button class="btn" id="r3">בוציון</button></div><p class="flav" id="rhint"></p>`+back,b=>{wire(b);
   const wrong=()=>{sfx('miss');b.querySelector('#rhint').textContent='לא בדיוק... חשבו על הכובע הנוצץ. אפשר לנסות שוב!'};
   b.querySelector('#r1').onclick=wrong;b.querySelector('#r3').onclick=wrong;
   b.querySelector('#r2').onclick=()=>{S.quests.riddleq=2;S.coins+=120;S.balls+=5;S.items=S.items||{};S.items.berry=(S.items.berry||0)+1;save();hud();sfx('ok');closeModal();mode='map';toast(' ניחשתם נכון! +120 מטבעות, 5 כדורים ופרי מרפא ',4500)}});return}
  modal(`<h2>סבתא חכמה וחידת הטלטלים</h2><p>״אה, מטיילים צעירים! יש לי חידה על טלטל מיוחד. מי שפותר מקבל פרס, ומי שקורא את האנציקלופדיה באוסף ידע את התשובה.״</p><button class="btn grn" id="sqa" style="width:100%">לשמוע את החידה</button>`+back,b=>{wire(b);b.querySelector('#sqa').onclick=()=>{S.quests.riddleq=1;save();closeModal();storyMenu(q)}});return}
 if(q.id==='letterq'){
  if(phase===2){modal(`<h2>נרקיס והמכתב</h2><p>״שלג קיבל את המכתב? איזה כיף! תודה שעברתם את כל הדרך.״</p>`+back,wire);return}
  if(phase===1){modal(`<h2>נרקיס והמכתב</h2><p>״המכתב אצלכם? שלג מחכה במערות הקרח, מזרחה מכאן. אם גיליתם את שער הקסם של המערות, הדרך קצרה הרבה!״</p>`+back,wire);return}
  modal(`<h2>נרקיס והמכתב לחוקר המערות</h2><p>״אני כותבת לחבר שלי, שלג חוקר המערות, אבל הדרך למערות הקרח ארוכה ואני לא יכולה לצאת מהביצה. תביאו לו את המכתב?״</p><button class="btn grn" id="sqa" style="width:100%">נביא את המכתב! </button>`+back,b=>{wire(b);b.querySelector('#sqa').onclick=()=>{S.quests.letterq=1;S.story.letter=1;save();sfx('ok');closeModal();mode='map';toast(' קיבלתם את המכתב! שלג מחכה במערות הקרח',4000)}});return}}
function questLog(){info('<h2> יומן המשימות</h2><p class="flav">גשו לדמויות עם סימן שאלה במפה, עמדו לצדן ולחצו בדיקה. סמנו  מעקב כדי לראות את היעד במפת העולם.</p>'+ALLQ.map(q=>`<div class="card" style="text-align:right;margin:8px 0;padding:12px"><b>${S.quests[q.id]===2?'✓':S.quests[q.id]===1?'':'?'} ${q.n}${S.tracked===q.id?' ':''}</b><p>${q.goal}</p><small>${S.quests[q.id]===2?'הושלמה':S.quests[q.id]===1?(q.test()?'הפרס מוכן! חזרו לדמות':'בתהליך'):'טרם התקבלה'} · ${ZONES[zoneAt(q.x,q.y)].n} · ${q.story?(q.id==='riddleq'?'פרס: 120 מטבעות, 5 כדורים ופרי מרפא':'פרס לבחירה בסיום'):(q.reward+' מטבעות'+(q.balls?' + '+q.balls+' כדורים':''))}</small>${S.quests[q.id]===1?`<button class="btn ${S.tracked===q.id?'grn':'sec'}" data-track="${q.id}" style="width:100%;margin-top:8px;min-height:38px">${S.tracked===q.id?' במעקב · לחצו להפסיק':' עקבו אחרי המשימה במפה'}</button>`:''}</div>`).join(''));
 document.querySelectorAll('#mbox [data-track]').forEach(b=>b.onclick=()=>{S.tracked=S.tracked===b.dataset.track?null:b.dataset.track;save();sfx('pick');questLog()})}
function gymLog(){info('<h2> מסע התגים</h2><p>קודם מנצחים את צור בגבעות וזוכים בתג הגביש, ואז פותחים את ההיכלים: היכל העלים, היכל הגלים, היכל הקרח והיכל הלהבה, ואחריהם אלוף הזוהר. היכלי הביצה והערפל פתוחים למי שיש תג מתאים. אחרי תג הלהבה נפתחים היכל החול במדבר והיכל הסערה בפסגות - ובסוף מחכה נורה, אלופת הסופה!</p>'+TRAINERS.filter(n=>n.gym).map(n=>`<div class="card" style="text-align:right;margin:8px 0;padding:12px"><h3>${S.defeated[n.id]?'':S.defeated[n.requires]?'':'חסום:'} ${n.n}</h3><p>${n.badge} · רמות ${n.team[0][1]}–${n.team.at(-1)[1]}</p><small>${ZONES[zoneAt(n.x,n.y)].n}</small></div>`).join(''))}
function questTarget(q){if(q.id==='lostq'&&S.quests.lostq===1&&!S.story.lostFound)return{...LOST_SPOT,n:'פטרוש האבוד'};if(q.id==='letterq'&&S.story.letter===1)return QUESTS.find(n=>n.id==='ice');return q}
function worldMap(){mode='menu';const GATE_REQ={D:'תג הגביש',E:'טלטל ברמה 10',F:'תג הגל',H:'טלטל ברמה 15',G:'תג הלהבה',I:'תג החול'};
 modal(`<h2> מפת העולם</h2><canvas id="wmc" width="288" height="176" style="width:100%;image-rendering:pixelated;border-radius:10px;background:#0e1a12"></canvas><p class="flav">עיגול צהוב: אתם · H: ריפוי וחנות · P: שער קסם שגיליתם · !: יעד משימה או פרס</p><div id="wmg" style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0"></div><button class="btn sec" id="wmb" style="width:100%">חזרה</button>`,b=>{
  const c2=b.querySelector('#wmc').getContext('2d');
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const t=M[y][x];let col;
   if(t===2||t===19)col='#2b7fd0';
   else if(t===1)col='#d8c88e';
   else if(t===28)col='#7a4ad0';
   else if(t===6||t===7||t===8||t===13)col='#c8453a';
   else if(t===3||t===4||t===5)col='#245c30';
   else if(t===15||t===18)col='#5a5a7a';
   else if(t===22)col='#3e8a4e';
   else if(t===27)col='#3a3a5e';
   else{const zt=TZ[zoneAt(x,y)]||['#9cc4ea','#6f9ccb'];col=isTall(t)?zt[1]:zt[0];}
   c2.fillStyle=col;c2.fillRect(x*2,y*2,2,2)}
  const mark=(x,y,ch)=>{const xx=x*2+1,yy=y*2+1;c2.lineWidth=1;c2.strokeStyle='#102518';c2.fillStyle=ch==='H'?'#ff7878':ch==='P'?'#d39aff':'#ffeb63';c2.fillRect(xx-3,yy-3,6,6);c2.strokeRect(xx-3,yy-3,6,6);c2.fillStyle='#102518';c2.font='bold 6px sans-serif';c2.textAlign='center';c2.textBaseline='middle';c2.fillText(ch,xx,yy)};
  [[23,68],[20,29],[85,67],[88,20]].forEach(h=>mark(h[0],h[1],'H'));
  PORTALS.forEach(p=>{if((S.portals||{})[p.id])mark(p.x,p.y,'P')});
  ALLQ.forEach(q=>{if(S.tracked===q.id&&S.quests[q.id]===1){const t=questTarget(q);mark(t.x,t.y,'!')}else if(S.quests[q.id]===1&&q.test())mark(q.x,q.y,'!')});
  
  c2.fillStyle='#ffd23f';c2.strokeStyle='#3a2200';c2.lineWidth=1;c2.beginPath();c2.arc(P.x*2+1,P.y*2+1,3,0,7);c2.fill();c2.stroke();
  c2.font='bold 7px system-ui';c2.fillStyle='#fff';
  const tracked=ALLQ.find(q=>q.id===S.tracked&&S.quests[q.id]===1);if(tracked){const t=questTarget(tracked);b.querySelector('#wmc').insertAdjacentHTML('afterend',`<p>במעקב: ${tracked.n}<br>היעד הבא: ${t.n} · ${ZONES[zoneAt(t.x,t.y)].n}</p>`)}b.querySelector('#wmg').innerHTML=['D','E','F','H','G','I'].map(z=>`<div class="card" style="padding:6px;font-size:12px">${GATES[z].ok()?'✓':'חסום:'} ${ZONES[z].n}${GATES[z].ok()?'':'<br><small>צריך: '+GATE_REQ[z]+'</small>'}</div>`).join('');
  b.querySelector('#wmb').onclick=()=>{closeModal();if(!$('#mnu').offsetParent)mode='map'}})}
function guide(){info(`<h2> מפת המסע · גרסה ${VER}</h2><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div class="card"> גבעות הגחלים<br>דרום־מערב</div><div class="card">🌊 חוף הברכה<br>דרום</div><div class="card"> אחו הפרחים<br>במרכז</div><div class="card" style="background:#7aa9df44">❄️ מערות הקרח<br>דרום־מזרחה, מעבר לגשר</div><div class="card" style="background:#4a8a5a44">🐸 הביצה הירוקה<br>צפונה מהאחו</div><div class="card" style="background:#e07a4a44">🌋 הר הגעש<br>מזרחה מהמערות</div><div class="card" style="background:#3a7a5a44">🌲 יער הערפל<br>בצפון, מעבר לביצה</div><div class="card" style="background:#e8cc7a44">🏜️ מדבר החולות<br>מזרחה מהגעש</div><div class="card" style="background:#6a70a844">⛈️ פסגות הסערה<br>צפונה מהמדבר</div></div><p class="flav">חדש בגרסה 4: שני אזורים חדשים, 10 טלטלים חדשים (40 בסך הכל!), משימות ומאמנים חדשים, ונקודות ניצוץ ✦ שנותנות מטבעות.</p><p class="flav">גרסה 4.1: כפתורי חיצים גדולים לליכה מדויקת (אפשר להחזיר ג׳ויסטיק מהתפריט), הביצה הירוקה מתאימה לשלב המוקדם של המסע, הבריחה מקרב קלה יותר, ומופיעה אזהרה בכניסה לאזור עם טלטלים פראיים חזקים.</p><p class="flav">גרסה 4.2: שערי אתגר לאזורים! הגשר למערות הקרח נפתח אחרי הזכייה בתג הגביש, לביצה הירוקה צריך טלטל ברמה 10 לפחות, ולהר הגעש צריך את תג הגל. שני היכלים חדשים עם תגים: היכל הביצה והיכל הלהבה! כדורי לכידה בשלוש דרגות: רגיל ⚪, משופר 🔵 עם סיכוי גבוה יותר, וכדור על 🟡 יקר ונדיר עם הסיכוי הטוב ביותר. במפה מפוזרות מתנות 🎁 נדירות עם כדורים ושיקויים.</p><p class="flav">גרסה 4.3: שיקויים בשלוש דרגות! שיקוי קטן  (15 🪙) מחזיר 35 חיים, סופר שיקוי (40 🪙) מחזיר חצי מהחיים או יותר, ואולטרה שיקוי (100 🪙, נדיר) מחזיר את כל החיים. בקרב בוחרים דרגה בתפריט השיקויים. מתנות 🎁 במפה יכולות להכיל גם סופר שיקוי ואולטרה שיקוי.</p><p class="flav">גרסה 4.3.1: מכות אדמה הוחלשו מעט, ומכות מים וצמח התחזקו. רמות הטלטלים הפראיים מותאמות לממוצע הרמות ולטלטל החזק בצוות. באזורים מתקדמים האתגר עולה, אך יריבים פראיים לא יעלו בהרבה על כוח הצוות. מאמנים, היכלים והאלוף שומרים על הרמות הקבועות שלהם.</p><p class= function confirmDeleteProfile(id){const player=profiles.players.find(p=>p.id===id);if(!player)return;modal(`<h2>למחוק את ${esc(player.name)}?</h2><p class="flav">כל ההתקדמות של ${esc(player.name)} תימחק מהמכשיר הזה. אי אפשר לשחזר אותה. שחקנים אחרים לא ייפגעו.</p><button class="btn red" id="deleteProfileConfirm" style="width:100%">כן, למחוק את ${esc(player.name)}</button><button class="btn sec" id="deleteProfileCancel" style="width:100%;margin-top:10px">לא, להשאיר</button>`,b=>{b.querySelector('#deleteProfileCancel').onclick=()=>{closeModal();showProfiles()};b.querySelector('#deleteProfileConfirm').onclick=()=>{const next={...profiles,players:profiles.players.filter(p=>p.id!==id)};if(next.active===id)next.active=null;try{localStorage.setItem(PROFILE_KEY,JSON.stringify(next))}catch(e){b.querySelector('#deleteProfileConfirm').textContent='אין מספיק מקום. לא בוצע שינוי.';return}profiles=next;showProfiles()}})}

function startMap(first){mapLayout(true);mode='map';region='';hud();$('#bmute').textContent=S.snd?'🔊':'🔇';if(first)toast('ברוך הבא! הליכה עם כפתורי החיצים (אפשר ג׳ויסטיק מהתפריט). בדיקה ליד דלת או מאמן 🎮',4500);else toast('📍 '+ZONES[zoneAt(P.x,P.y)].n)}

const dp=$('#dpad');let dpId=null;
function dpadOff(){held=null;dpId=null;analogPower=1;dp.querySelector('i').style.transform='translate(0,0)';document.querySelectorAll('#arrows button.on').forEach(b=>b.classList.remove('on'))}
function dpUpdate(e){if(mode!=='map')return;const r=dp.getBoundingClientRect(),dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),len=Math.hypot(dx,dy),radius=r.width*.3,k=len>radius?radius/len:1;dp.querySelector('i').style.transform=`translate(${dx*k}px,${dy*k}px)`;analogPower=clamp(len/radius,0,1);if(len<r.width*.12){held=null;return}held=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up')}
dp.addEventListener('pointerdown',e=>{if(mode!=='map')return;ac();dpId=e.pointerId;dp.setPointerCapture(e.pointerId);dpUpdate(e);e.preventDefault()});

document.querySelectorAll('#arrows button').forEach(b=>{const d=b.dataset.d;b.addEventListener('pointerdown',e=>{if(mode!=='map')return;ac();held=d;analogPower=1;b.classList.add('on');try{b.setPointerCapture(e.pointerId)}catch(_){}e.preventDefault()});['pointerup','pointercancel','lostpointercapture'].forEach(n=>b.addEventListener(n,()=>{if(held===d)held=null;b.classList.remove('on')}))});
